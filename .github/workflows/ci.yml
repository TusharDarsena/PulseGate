name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  contracts:
    name: 🦀 Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts -> target

      - name: Check
        run: cargo check --target wasm32v1-none
        working-directory: contracts

      - name: Test
        run: cargo test
        working-directory: contracts

  frontend:
    name: ⚡ Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Lint
        run: pnpm run lint
        working-directory: frontend

      - name: Build
        run: pnpm run build
        working-directory: frontend
        env:
          VITE_TICKET_CONTRACT_ID: dummy
          VITE_MARKETPLACE_CONTRACT_ID: dummy
          VITE_NETWORK_PASSPHRASE: Test SDF Network ; September 2015
          VITE_RPC_URL: https://soroban-testnet.stellar.org:443
          VITE_HORIZON_URL: https://horizon-testnet.stellar.org
          VITE_STELLAR_EXPLORER_URL: https://stellar.expert/explorer/testnet
          VITE_SUPABASE_URL: dummy
          VITE_SUPABASE_ANON_KEY: dummy

  frontend-tests:
    name: 🧪 Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Test
        run: pnpm test
        working-directory: frontend
        env:
          VITE_TICKET_CONTRACT_ID: test-ticket-contract
          VITE_MARKETPLACE_CONTRACT_ID: test-marketplace-contract
          VITE_NETWORK_PASSPHRASE: Test SDF Network ; September 2015
          VITE_RPC_URL: https://soroban-testnet.stellar.org:443
          VITE_HORIZON_URL: https://horizon-testnet.stellar.org
          VITE_STELLAR_EXPLORER_URL: https://stellar.expert/explorer/testnet
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: test-anon-key
