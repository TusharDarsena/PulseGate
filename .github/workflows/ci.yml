name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  contracts:
    name: 🦀 Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts -> target

      - name: Check
        run: cargo check --target wasm32v1-none
        working-directory: contracts

      - name: Test
        run: cargo test
        working-directory: contracts

  frontend:
    name: ⚡ Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: corepack enable && pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          VITE_TICKET_CONTRACT_ID: dummy
          VITE_MARKETPLACE_CONTRACT_ID: dummy
          VITE_NETWORK_PASSPHRASE: Test SDF Network ; September 2015
          VITE_RPC_URL: https://soroban-testnet.stellar.org:443
          VITE_HORIZON_URL: https://horizon-testnet.stellar.org
          VITE_STELLAR_EXPLORER_URL: https://stellar.expert/explorer/testnet
          VITE_SUPABASE_URL: dummy
          VITE_SUPABASE_ANON_KEY: dummy

  frontend-tests:
    name: 🧪 Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: corepack enable && pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Test
        run: npm test
        working-directory: frontend
        env:
          VITE_TICKET_CONTRACT_ID: test-ticket-contract
          VITE_MARKETPLACE_CONTRACT_ID: test-marketplace-contract
          VITE_NETWORK_PASSPHRASE: Test SDF Network ; September 2015
          VITE_RPC_URL: https://soroban-testnet.stellar.org:443
          VITE_HORIZON_URL: https://horizon-testnet.stellar.org
          VITE_STELLAR_EXPLORER_URL: https://stellar.expert/explorer/testnet
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: test-anon-key
